name: Проверка каталога

on:
  pull_request:
    branches: [community-lists]
  push:
    branches: [community-lists]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_catalog.py
