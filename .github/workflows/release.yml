name: Релиз

# Собирает .exe и выкладывает его, когда появляется тег вида 1.2.3 или v1.2.3.
#
# Первый релиз лучше выпустить руками: так видно, что именно попало в сборку,
# и можно убедиться, что самообновление находит файл. Автоматизировать стоит
# после того, как ручной релиз отработал — отлаживать сборку вслепую мучительно.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Сборка только на Windows: PyInstaller делает исполняемый файл под ту
    # систему, на которой запущен.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Устанавливается обычным образом, а не через -e. При установке editable
      # пакет подменяется на перенаправитель, и PyInstaller видит в нём только
      # верхний уровень: сборка проходит, а в .exe не попадает ни один
      # подпакет — ошибку обнаруживает уже пользователь, при первом запуске.
      - name: Поставить зависимости
        run: |
          pip install ".[ai,dev]"
          pip install pyinstaller

      - name: Проверить перед сборкой
        run: |
          python -m pytest tests/ -q
          python -m ruff check app/ tests/ tools/

      - name: Диагностика окружения
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from PyInstaller import isolated

          import app, app.core, app.ui.theme
          print("обычный импорт:", app.__file__, app.core.__file__)
          print("пути:", sys.path[:5])

          @isolated.decorate
          def probe():
              import sys
              try:
                  import app.ui.theme as theme
                  return ("ok", theme.__file__, sys.path[:5])
              except Exception as error:
                  return ("fail", repr(error), sys.path[:6])

          print("изолированный импорт:", probe())
          PY

      - name: Собрать
        run: python tools/build_release.py

      # Тесты проверяют исходники, а в релиз уезжает .exe: внутрь него модуль
      # может просто не попасть, и тогда программа падает при первом импорте,
      # показывая диалог, которого в CI никто не увидит. Поэтому собранный
      # файл запускается здесь же — без интерфейса, только чтобы убедиться,
      # что он вообще стартует.
      - name: Проверить, что сборка запускается
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/ZapretXmel.exe -ArgumentList '--version' -PassThru
          if (-not $app.WaitForExit(60000)) {
            $app.Kill()
            throw "сборка не завершилась за минуту — скорее всего, показала диалог об ошибке"
          }
          if ($app.ExitCode -ne 0) {
            throw "сборка завершилась с кодом $($app.ExitCode)"
          }

      # Два последних шага имеют смысл только для тега. Запуск руками
      # (workflow_dispatch) нужен, чтобы прогнать проверки и сборку, ничего
      # не выкладывая: иначе он падал бы на сверке версии с именем ветки.
      - name: Сверить версию с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import app; print(app.__version__)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Тег $TAG не совпадает с версией в app/__init__.py ($VERSION)."
            echo "Самообновление сравнивает тег именно с ней — иначе обновление себя не увидит."
            exit 1
          fi

      - name: Выложить релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ZapretXmel.exe
            dist/ZapretXmel.exe.sha256
          generate_release_notes: true
