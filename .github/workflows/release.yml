name: Релиз

# Собирает переносной .exe и установщик и выкладывает их, когда появляется тег
# вида 1.2.3 или v1.2.3.
#
# Первый релиз лучше выпустить руками: так видно, что именно попало в сборку,
# и можно убедиться, что самообновление находит файл. Автоматизировать стоит
# после того, как ручной релиз отработал — отлаживать сборку вслепую мучительно.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Сборка только на Windows: PyInstaller делает исполняемый файл под ту
    # систему, на которой запущен.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Устанавливается обычным образом, а не через -e. При установке editable
      # пакет подменяется на перенаправитель, и PyInstaller видит в нём только
      # верхний уровень: сборка проходит, а в .exe не попадает ни один
      # подпакет — ошибку обнаруживает уже пользователь, при первом запуске.
      - name: Поставить зависимости
        run: |
          pip install ".[ai,dev]"
          pip install pyinstaller

      # Каждая проверка — отдельным шагом. В одном шаге PowerShell отдаёт код
      # возврата только последней команды: упавший pytest оставался зелёным,
      # потому что следом отрабатывал линтер.
      - name: Тесты
        run: python -m pytest tests/ -q

      - name: Линтер
        run: python -m ruff check app/ tests/ tools/

      # Установщик собирается Inno Setup — на сборочной машине его может не быть.
      - name: Поставить Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Собрать
        run: python tools/build_release.py

      # Тесты проверяют исходники, а в релиз уезжает .exe: внутрь него модуль
      # может просто не попасть, и тогда программа падает при первом импорте,
      # показывая диалог, которого в CI никто не увидит. Поэтому собранный
      # файл запускается здесь же — без интерфейса, только чтобы убедиться,
      # что он вообще стартует.
      - name: Проверить, что сборка запускается
        shell: pwsh
        run: |
          foreach ($exe in 'dist/ZapretXmel-Windows-Portable.exe', 'build/onedir/ZapretXmel/ZapretXmel.exe') {
            $app = Start-Process -FilePath $exe -ArgumentList '--version' -PassThru
            if (-not $app.WaitForExit(60000)) {
              $app.Kill()
              throw "$exe не завершился за минуту — скорее всего, показал диалог об ошибке"
            }
            if ($app.ExitCode -ne 0) {
              throw "$exe завершился с кодом $($app.ExitCode)"
            }
          }

      # Установщик проверяется целиком, как у человека: тихая установка,
      # запуск установленной программы и удаление. Удаление зовёт саму
      # программу (--uninstall), и если она там упадёт, папка не исчезнет.
      - name: Проверить установщик
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'ZapretXmel-test'
          $setup = Start-Process dist/ZapretXmel-Windows-Setup.exe -PassThru -Wait -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dir", "/LOG=$env:RUNNER_TEMP\setup.log"
          if ($setup.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "установщик вернул $($setup.ExitCode)" }
          if (-not (Test-Path "$dir\_internal")) { throw "установщик не положил сборку папкой" }

          $app = Start-Process "$dir\ZapretXmel.exe" -ArgumentList '--version' -PassThru
          if (-not $app.WaitForExit(60000) -or $app.ExitCode -ne 0) { throw "установленная программа не запускается" }

          Start-Process "$dir\unins000.exe" -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          # Деинсталлятор перезапускает себя копией и сразу возвращает управление.
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path "$dir\ZapretXmel.exe") -and (Get-Date) -lt $deadline) { Start-Sleep 2 }
          if (Test-Path "$dir\ZapretXmel.exe") { throw "удаление не убрало программу" }
          if (Test-Path "$dir\data") { throw "удаление оставило данные программы" }

      # Запуск руками ничего не выкладывает, но собранное нужно где-то взять,
      # чтобы проверить установщик до релиза.
      - name: Сохранить сборку
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ZapretXmel-${{ github.sha }}
          path: dist/

      # Два последних шага имеют смысл только для тега. Запуск руками
      # (workflow_dispatch) нужен, чтобы прогнать проверки и сборку, ничего
      # не выкладывая: иначе он падал бы на сверке версии с именем ветки.
      - name: Сверить версию с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import app; print(app.__version__)")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Тег $TAG не совпадает с версией в app/__init__.py ($VERSION)."
            echo "Самообновление сравнивает тег именно с ней — иначе обновление себя не увидит."
            exit 1
          fi

      # Описание берётся из CHANGELOG.md: автоматические заметки GitHub — это
      # перечень коммитов, написанный для того, кто правит код, а не для того,
      # кто программой пользуется. Нет раздела про версию — сборка падает, и
      # релиз без описания не выйдет.
      - name: Собрать описание релиза
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: python tools/release_notes.py "${GITHUB_REF_NAME#v}" -o release-notes.md

      - name: Выложить релиз
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # ZapretXmel.exe — та же переносная под прежним именем: по нему ищут
          # обновление версии до 0.4.0.
          files: |
            dist/ZapretXmel-Windows-Portable.exe
            dist/ZapretXmel-Windows-Portable.exe.sha256
            dist/ZapretXmel-Windows-Setup.exe
            dist/ZapretXmel-Windows-Setup.exe.sha256
            dist/ZapretXmel.exe
            dist/ZapretXmel.exe.sha256
          body_path: release-notes.md
          # Тег с дефисом (1.1.0-rc.1) — тестовая сборка. GitHub не отдаёт
          # такие в «последнем релизе», поэтому ссылка на релиз и обычные
          # пользователи их не увидят: нужна галочка в настройках.
          prerelease: ${{ contains(github.ref_name, '-') }}
